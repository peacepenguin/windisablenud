name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: cmd
        run: build.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: LocalSubnetGuard
          path: bin/LocalSubnetGuard.exe
